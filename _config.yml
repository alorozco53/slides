# --- General options --- #

# url is the full website URL
# baseurl is the website's URL without the hostname
url: ""
baseurl: ""

# Name of website
title: "Reveal.js + Jekyll Template"

# Short description of your site
description: "A minimalistic Jekyll-based framework for authoring reveal.js presentations."

collections:
  presentations:
    output: true
    permalink: /presentations/:path/

# --- Navigation bar options --- #

# List of links in the navigation bar
navbar-links:
  - name: "Home"
    url: ""
  - name: "Examples"
    url: "examples"

# Image to show in the navigation bar - image must be a square (width = height).
# Remove or leave commented out for no avatar in the navbar.
# avatar: "/img/your-avatar.png"

# If you want to have an image logo in the top-left corner instead of the title text,
# then specify the following parameter
# title-img: /path/to/image

# --- Background colour/image options --- #

# Personalize the colors in your website. Colour values can be any valid CSS colour
navbar-col: "#010101"
navbar-text-col: "#FFFFFF"
navbar-children-col: "#6A6868"
page-col: "#010101"
link-col: "#008AFF"
body-text-col: "#0AC9D7"
hover-col: "#E0ECF9"
footer-col: "#010101"
footer-text-col: "#777777"
footer-link-col: "#404040"

# Light mode
light-theme:
  navbar-col: "#FFFFFF"
  navbar-text-col: "#000000"
  navbar-children-col: "#C0C0C0"
  page-col: "#FFFFFF"
  link-col: "#0066CC"
  body-text-col: "#000000"
  hover-col: "#004080"
  footer-col: "#F5F5F5"
  footer-text-col: "#404040"
  footer-link-col: "#000000"

# --- Footer options --- #

# Change all these values or delete the ones you don't want.
# Important: you must keep the "name" parameter, everything else you can remove
author:
  name: "Your Name"

# Select your active Social Network Links. Uncomment + customize the links you
# want to surface in the footer. Each key must also be defined in
# _data/SocialNetworks.yml.
social-network-links:
  # email: "you@example.com"
  # github: yourhandle
  # twitter: yourhandle
  # linkedin: yourhandle

# How to display the link to the website in the footer.
# Remove or leave blank if you don't want a link in the footer.
url-pretty: ""

# --- Misc --- #

# Excerpt Word Length
# Truncates the excerpt to the specified number of words on the index page
excerpt_length: 50

# Character used to separate site title and description in HTML document title
title-separator: "-"

# --- Don't need to touch anything below here (but you can if you want) --- #

# Output options (more information on Jekyll's site)
timezone: "America/Vancouver"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

# Default YAML values (more information on Jekyll's site)
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: "" # all files
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "presentations"
    values:
      layout: "reveal"
      reveal:
        theme: night
        controls: true
        progress: true
        history: true
        center: true
        transition: slide
        backgroundTransition: fade
        menu: true
        notes: true
        markdown: true
        highlight: true
        zoom: true
        math: false
        title_footer: false
        home_link: true

# Exclude these files from production site
exclude:
  - CHANGELOG.md
  - CNAME
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - Makefile
  - README.md
  - Vagrantfile
  - vendor
  - .bundle

plugins:
  - jekyll-paginate
  - jekyll-sitemap
