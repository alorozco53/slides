- Lists, headings, emphasis, links — all work
- Code fences highlight via the `highlight` plugin

## Plugins Enabled

- `menu`: open the slide menu (top-left icon)
- `notes`: press **S** to open the speaker view
- `zoom`: hold **Alt** and click to zoom
- `chalkboard`: press **b** for whiteboard, **c** to draw

## Authoring Your Own

1. Drop a new `.html` file in `_presentations/`
2. Add Reveal config in the YAML front matter
3. Write `<section>` blocks (HTML or Markdown)

That's it — `make run` and you're live.
